name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./prisma/dev.db"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest уже содержит системные библиотеки Chromium; --with-deps
      # ходит в apt и валит job при недоступности archive.ubuntu.com.
      - run: npx playwright install chromium
      # Свежая БД должна собираться миграциями, а не db push.
      - run: npx prisma migrate deploy
      # schema.prisma без миграции — это drift, который нельзя мержить.
      - run: npm run db:migrate:check
      - run: npm run test:all
